<p>{{ count }}</p>
<button (click)="incrementCount()">Сменить число</button>
<button (click)="incrementCountAfterTimeout()">Увеличить после setTimeout</button>
<button (click)="incrementCountAfterPromise()">Увеличить после Promise</button>
<button (click)="incrementCountAfterRequest()">Увеличить после HttpRequest</button>
<button (click)="incrementCountAfterInterval()">Увеличить после setInterval</button>
<button (click)="incrementCountMultiple()">Увеличить несколькими способами</button>
